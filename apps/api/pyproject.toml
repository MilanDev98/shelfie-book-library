[project]
name = "shelfie-api"
version = "0.1.0"
description = "Django REST API for Shelfie"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django==6.1",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.0",
    "djangorestframework-stubs==3.18.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "ruff==0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"
